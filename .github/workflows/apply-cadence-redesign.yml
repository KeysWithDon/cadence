name: apply-cadence-redesign
on:
  push:
    paths:
      - WORKSHOP_REDESIGN_TRIGGER.md
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          page = Path('page.tsx')
          s = page.read_text()
          s = s.replace('type PlaybackStyle = "block" | "arpeggio";', 'type PlaybackStyle = "block";')
          s = s.replace('''  const releaseAt = Math.max(.2, holdSeconds);\n  const notes = playbackStyle === "arpeggio" ? [...midis].sort((a,b)=>a-b) : midis;\n  // Keep the sweep musical at both slow and fast tempos, while letting every\n  // note ring through the chord change instead of cutting off early.\n  const arpeggioGap = playbackStyle === "arpeggio" ? Math.min(.11, Math.max(.045, holdSeconds / (notes.length + 4))) : 0;''', '''  const releaseAt = Math.max(.2, holdSeconds);\n  const notes = midis;\n  const arpeggioGap = 0;''')
          s = s.replace('''  const [playbackStyle, setPlaybackStyle] = useState<PlaybackStyle>("block");''', '''  const [playbackStyle] = useState<PlaybackStyle>("block");''')
          s = s.replace('''    setWorkshopSuggestionIndex(0); setPlaybackStyle("block");''', '''    setWorkshopSuggestionIndex(0);''')
          s = s.replace("['target','Target practice'],", '')
          s = s.replace('''          {generatorMode==="workshop"&&<label className="workshop-suggestion">NEXT CHORD<select value={Math.min(workshopSuggestionIndex, Math.max(0, workshopSuggestions.length-1))} onChange={e=>setWorkshopSuggestionIndex(+e.target.value)} aria-label="Suggested next chord">{workshopSuggestions.map((suggestion,index)=><option value={index} key={`${suggestion.label}-${suggestion.chord}-${index}`}>{suggestion.label} · {suggestion.chord}</option>)}</select></label>}\n''', '''          {generatorMode==="workshop"&&<div className="workshop-guidance">SUGGESTIONS ARE OPTIONAL · choose any chord, or add one of the ideas below</div>}\n''')
          s = s.replace('''          <label className="play-style">PLAY STYLE<select aria-label="Choose block chords or arpeggios" value={playbackStyle} onChange={e=>setPlaybackStyle(e.target.value as PlaybackStyle)}><option value="block">Block chords</option><option value="arpeggio">Arpeggiate</option></select></label>\n''', '')
          s = s.replace('''    if (generatorMode === "workshop") {\n      if (!activeWorkshopSuggestion) return;\n      setProgression((items) => [...items, activeWorkshopSuggestion.chord]);\n      setDurations((items) => [...items, 1]);\n      setSelected(progression.length); setEditTarget(null); setSubstitutionHistory([]);\n      return;\n    }''', '''    if (generatorMode === "workshop") {\n      return;\n    }''')
          s = s.replace('''generatorMode==="workshop"?`Add ${activeWorkshopSuggestion?.chord??"chord"}`:''', '''generatorMode==="workshop"?"Suggestions below":''')
          s = s.replace('''          <button className="primary" onClick={generate}><span>{generatorMode==="workshop"?"＋":"↻"}</span>''', '''          <button className={`primary ${generatorMode==="workshop"?"workshop-disabled":""}`} onClick={generate} disabled={generatorMode==="workshop"}><span>{generatorMode==="workshop"?"✦":"↻"}</span>''')
          s = s.replace('''          {generatorMode!=="standards"&&generatorMode!=="circle"&&<button className="add-tile" onClick={generate}>＋<span>{generatorMode==="workshop"?"Add suggestion":"New idea"}</span></button>}''', '''          {generatorMode!=="standards"&&generatorMode!=="circle"&&<button className="add-tile" onClick={generatorMode==="workshop"?()=>addWorkshopChord(workshopSuggestions[workshopSuggestionIndex]?.chord):generate}>＋<span>{generatorMode==="workshop"?"Add chosen idea":"New idea"}</span></button>}''')
          s = s.replace('''            <button className="listen" onClick={()=>voicedChord&&playNotes(audibleNotes(voicedChord,includeBass),1.15,includeBass?voicedChord.bass:undefined,playbackStyle)}>▶ &nbsp; Hear {playbackStyle==="arpeggio"?"arpeggio":includeBass?"voicing + bass":"voicing"}</button>''', '''            <button className="listen" onClick={()=>voicedChord&&playNotes(audibleNotes(voicedChord,includeBass),1.15,includeBass?voicedChord.bass:undefined,playbackStyle)}>▶ &nbsp; Hear {includeBass?"voicing + bass":"voicing"}</button>''')
          new_fn = '''function workshopChordSuggestions(key: string, extensionsEnabled: boolean, extensionLevel: "7"|"9"|"11"|"13") {\n  const diatonic = buildDiatonicSevenths(key);\n  const shaped = (chord: string) => extensionsEnabled ? setChordComplexity(chord, musicalComplexity(chord, extensionLevel)) : setChordComplexity(chord, "triad");\n  const items = [\n    { chord: diatonic[0], category: "STAY HOME", label: "Tonic · I", reason: "stable landing; keeps the key feeling centered" },\n    { chord: diatonic[1], category: "KEEP MOVING", label: "Predominant · ii", reason: "opens the door toward dominant motion without forcing it" },\n    { chord: diatonic[2], category: "ADD COLOR", label: "Color · iii", reason: "keeps the key while changing the emotional shade" },\n    { chord: diatonic[3], category: "LIFT", label: "Lift · IV", reason: "brightens the phrase and gives the melody room to rise" },\n    { chord: diatonic[4], category: "CREATE PULL", label: "Dominant · V", reason: "creates a strong pull toward I, but you can go elsewhere" },\n    { chord: diatonic[5], category: "CHANGE THE MOOD", label: "Relative minor · vi", reason: "keeps familiar notes while turning the color inward" },\n    { chord: `${spellRomanDegree(key, 5)}7`, category: "CREATE PULL", label: "Secondary dominant", reason: "adds a temporary destination and stronger forward motion" },\n    { chord: `${spellRomanDegree(key, 4)}m7`, category: "BORROW COLOR", label: "Borrowed iv", reason: "darkens the major key without abandoning its home" },\n    { chord: `${spellRomanDegree(key, 2, -1)}maj7`, category: "SURPRISE", label: "♭II borrowed color", reason: "a cinematic chromatic shift with a smooth common-tone option" },\n    { chord: `${spellRomanDegree(key, 6, -1)}maj7`, category: "SURPRISE", label: "♭VI borrowed color", reason: "adds warmth and drama while keeping the tonic available" },\n  ];\n  return items.map(item => ({ ...item, chord: shaped(item.chord) }));\n}\n'''
          s = re.sub(r'function workshopChordSuggestions\(.*?\n}\n\nexport default function Home\(\)', new_fn + '\nexport default function Home()', s, count=1, flags=re.S)
          s = s.replace('''  const activeWorkshopSuggestion = workshopSuggestions[workshopSuggestionIndex] ?? workshopSuggestions[0];''', '''  const activeWorkshopSuggestion = workshopSuggestions[workshopSuggestionIndex] ?? workshopSuggestions[0];\n  const visibleWorkshopSuggestions = [0,1,2,3,4].map(offset => workshopSuggestions[(workshopSuggestionIndex + offset) % workshopSuggestions.length]).filter(Boolean);''')
          s = s.replace('''  function generate() {''', '''  function addWorkshopChord(chordName: string) {\n    if (generatorMode !== "workshop" || !chordName) return;\n    setProgression((items) => [...items, chordName]);\n    setDurations((items) => [...items, 1]);\n    setSelected(progression.length);\n    setEditTarget(null);\n    setSubstitutionHistory([]);\n  }\n\n  function generate() {''', 1)
          marker = '''        {editTarget!==null&&<div className="substitution-compact">'''
          advisor = '''        {generatorMode==="workshop"&&<div className="workshop-advisor">\n          <div className="workshop-advisor-head"><div><span className="step">02 · HARMONY ADVISOR</span><h3>Ideas, not instructions</h3><p>Every suggestion is optional. Add one, ignore it, or choose your own chord.</p></div><button type="button" onClick={()=>setWorkshopSuggestionIndex(i=>(i+5)%workshopSuggestions.length)}>✦ More ideas</button></div>\n          <div className="workshop-suggestion-grid">\n            {visibleWorkshopSuggestions.map((suggestion,index)=><article className="workshop-suggestion-card" key={`${suggestion.category}-${suggestion.chord}-${index}`}><span>{suggestion.category}</span><strong>{suggestion.chord}</strong><b>{suggestion.label}</b><p>{suggestion.reason}</p><button type="button" onClick={()=>addWorkshopChord(suggestion.chord)}>＋ Add this chord</button></article>)}\n          </div>\n        </div>}\n\n'''
          if marker in s and 'HARMONY ADVISOR' not in s: s = s.replace(marker, advisor + marker, 1)
          page.write_text(s)
          css = Path('spacing.css')
          c = css.read_text()
          c += '''\n\n/* Cadence workshop: wide, fluid desktop surface + optional harmony advisor. */\n.workspace{width:100%;max-width:1720px;margin-inline:auto;padding-inline:clamp(16px,3vw,64px)}\n.workspace>.teacher,.teacher>.piano-wrap,.piano-shell{width:100%;min-width:0}\n.teacher>.lesson-note{display:block!important;margin-top:18px}\n.workshop-guidance{font:600 10px "DM Mono";letter-spacing:.08em;color:#536159;align-self:center;padding:8px 10px}\n.workshop-disabled{opacity:.6;cursor:default}\n.workshop-advisor{margin:8px 0 26px;padding:18px 20px;background:#f1f4ef;border-left:4px solid #ef6b3a}\n.workshop-advisor-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:14px}\n.workshop-advisor-head h3{margin:3px 0 4px;font-size:22px;color:#14231d}.workshop-advisor-head p{margin:0;color:#68726c;font-size:13px}.workshop-advisor-head button{border:1px solid #14231d;background:#fffdf8;border-radius:99px;padding:9px 14px;font-weight:700;white-space:nowrap}\n.workshop-suggestion-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}\n.workshop-suggestion-card{background:#fffdf8;border:1px solid #d9d5ca;padding:13px;display:flex;flex-direction:column;min-height:160px}.workshop-suggestion-card>span{font:600 9px "DM Mono";letter-spacing:.08em;color:#ef6b3a}.workshop-suggestion-card strong{font-size:24px;margin:6px 0 2px;color:#14231d}.workshop-suggestion-card>b{font-size:11px;color:#536159}.workshop-suggestion-card p{font-size:11px;line-height:1.45;color:#68726c;flex:1;margin:8px 0 12px}.workshop-suggestion-card button{border:1px solid #14231d;background:#14231d;color:#fff;border-radius:3px;padding:8px 10px;font-size:10px;font-weight:700}\n@media(max-width:1200px){.workshop-suggestion-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}\n@media(max-width:700px){.workspace{padding-inline:12px}.workshop-advisor{padding:14px}.workshop-advisor-head{flex-direction:column}.workshop-suggestion-grid{grid-template-columns:1fr 1fr}.workshop-suggestion-card{min-height:145px}}\n@media(max-width:480px){.workshop-suggestion-grid{grid-template-columns:1fr}.workshop-guidance{display:none}}\n@media(min-width:1500px){.workspace{max-width:1760px}}\n@media(min-width:901px){.hero{padding-inline:clamp(24px,4vw,72px)}.generator-card{width:100%;max-width:1720px;margin-inline:auto}.progression-row{width:100%}.piano-wrap{width:100%}.piano-shell .piano{min-width:0;width:100%}}\n:fullscreen .teacher>.lesson-note{display:block!important}\n:-webkit-full-screen .teacher>.lesson-note{display:block!important}\n'''
          css.write_text(c)
          Path('WORKSHOP_REDESIGN_TRIGGER.md').unlink(missing_ok=True)
          PY
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git add page.tsx spacing.css WORKSHOP_REDESIGN_TRIGGER.md
          git commit -m 'Redesign workshop and restore block chord playback'
          git push
